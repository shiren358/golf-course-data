<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ゴルフカウンター - 友達のラウンド</title>
<meta name="robots" content="noindex" />
<meta name="apple-itunes-app" content="app-id=6820027355" />
<meta name="theme-color" content="#08432a" />
<!--
  ゴルフカウンター(Golf Counter)の「友達に見せる」のリンク先。?c=ABC234 の合言葉で、
  Supabase の golf_shared_round(読むだけの関数)からラウンドを読み、スコアカードを出す。
  アプリが入っていれば「アプリで再生を見る」(golfcounter://round/ABC234)で再生まで見られる。
  鍵は公開用(publishable)。表は閉じていて、読めるのは合言葉を知っている1ラウンドだけ。
-->
<style>
  :root { --deep:#08432a; --green:#126b3d; --gold:#e3b340; --paper:#f7f4ea; --ink:#14201a; --muted:#6b756f; --line:#e2ded0;
    --under:#006bd9; --over:#cc3829; }
  * { box-sizing: border-box; }
  body { margin:0; background:#eef1ec; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.6; }
  .wrap { max-width:520px; margin:0 auto; padding:16px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; color:var(--deep); margin:6px 0 14px; }
  .brand img { width:36px; height:36px; border-radius:9px; }
  .card { background:var(--paper); border-radius:20px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.12); }
  .head { background:linear-gradient(135deg,#1e854d,var(--deep)); color:#fff; padding:14px 16px; }
  .head small { opacity:.85; display:block; }
  .head b { font-size:19px; }
  .sum { display:flex; align-items:flex-end; gap:12px; padding:14px 16px 6px; }
  .sum .total { font-size:56px; font-weight:900; line-height:1; font-variant-numeric:tabular-nums; }
  .sum .par { font-size:22px; font-weight:800; }
  .sum .who { margin-left:auto; text-align:right; color:var(--muted); font-size:14px; }
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  th, td { text-align:center; padding:5px 0; }
  .grid { padding:8px 10px 14px; }
  .grid table + table { margin-top:10px; }
  thead th { background:var(--green); color:#fff; font-weight:700; }
  thead th:first-child { border-radius:8px 0 0 8px; } thead th:last-child { border-radius:0 8px 8px 0; }
  tbody th { text-align:left; padding-left:6px; color:var(--muted); font-weight:600; white-space:nowrap; }
  tr.me td { font-weight:900; font-size:15px; }
  td.u { color:var(--under); } td.o { color:var(--over); }
  .btns { display:grid; gap:10px; margin:18px 0; }
  .btn { display:block; text-align:center; text-decoration:none; font-weight:800; padding:14px; border-radius:14px; }
  .btn.main { background:var(--deep); color:#fff; }
  .btn.sub { background:#fff; color:var(--deep); border:1px solid var(--line); }
  .note { color:var(--muted); font-size:13px; text-align:center; }
  .msg { text-align:center; padding:40px 16px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="https://tomople.com/apps/golf-counter/icon.png" alt="" /><span data-t="brand">ゴルフカウンター</span></div>
  <div id="out"><p class="msg" data-t="loading">読み込み中…</p></div>
  <div class="btns">
    <a class="btn main" id="open" href="#" data-t="open">アプリで再生を見る</a>
    <a class="btn sub" href="https://apps.apple.com/app/id6820027355" data-t="get">App Store でゴルフカウンターを入手</a>
  </div>
  <p class="note" data-t="note">アプリで開くと、一打ごとの行方を地図の上で再生できます(iPhone)。</p>
</div>
<script>
(function () {
  var en = !/^ja/.test(navigator.language || 'ja');
  var T = en ? {
    brand: 'Golf Counter', loading: 'Loading…', open: 'Watch the replay in the app', get: 'Get Golf Counter on the App Store',
    note: 'In the app, every shot is replayed on the map (iPhone).', notfound: 'No round with this code.', offline: 'Couldn’t load the round. Try again.',
    hole: 'Hole', par: 'Par', score: 'Score', putts: 'Putts', friend: 'A friend', nocourse: 'No course', title: 'Golf Counter - A friend’s round'
  } : {
    notfound: 'この合言葉のラウンドはありません。', offline: '読み込めませんでした。もう一度開いてください。',
    hole: 'ホール', par: 'パー', score: 'スコア', putts: 'パット', friend: '友達', nocourse: 'ゴルフ場なし'
  };
  if (en) {
    document.documentElement.lang = 'en'; document.title = T.title;
    document.querySelectorAll('[data-t]').forEach(function (el) { var v = T[el.getAttribute('data-t')]; if (v) el.textContent = v; });
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var out = document.getElementById('out');
  var code = (new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^A-Z2-9]/g, '');
  document.getElementById('open').href = 'golfcounter://round/' + code;
  if (code.length !== 6) { out.innerHTML = '<p class="msg">' + T.notfound + '</p>'; return; }

  fetch('https://ehqtadbhdljfscpzcnuy.supabase.co/rest/v1/rpc/golf_shared_round', {
    method: 'POST',
    headers: { apikey: 'sb_publishable_L5f8L9tKrh8B-CNUuaDjhg_ANT48xxY', 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_code: code })
  }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (data) {
    if (!data || !data.round) { out.innerHTML = '<p class="msg">' + T.notfound + '</p>'; return; }
    var r = data.round, holes = r.holes || [];
    var strokes = function (h) { return (h.log || []).length; };
    var putts = function (h) { return (h.log || []).filter(function (k) { return k === 'putt'; }).length; };
    var played = holes.filter(function (h) { return strokes(h) > 0; });
    var total = played.reduce(function (a, h) { return a + strokes(h); }, 0);
    var toPar = played.reduce(function (a, h) { return a + strokes(h) - h.par; }, 0);
    var date = new Date(r.startedAt);
    var name = data.name || T.friend;
    var html = '<div class="card"><div class="head"><small>' + esc(r.course ? r.course.name : T.nocourse) + '</small><b>' +
      date.toLocaleDateString(en ? 'en-US' : 'ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' }) + '</b></div>' +
      '<div class="sum"><span class="total">' + total + '</span><span class="par" style="color:' + (toPar < 0 ? 'var(--under)' : toPar > 0 ? 'var(--over)' : 'var(--muted)') + '">' +
      (toPar > 0 ? '+' + toPar : toPar === 0 ? 'E' : '−' + (-toPar)) + '</span><span class="who">' + esc(name) + '</span></div><div class="grid">';
    for (var start = 0; start < holes.length; start += 9) {
      var nine = holes.slice(start, start + 9);
      var row = function (label, fn, cls) {
        return '<tr class="' + (cls || '') + '"><th>' + label + '</th>' + nine.map(fn).join('') + '</tr>';
      };
      html += '<table><thead><tr><th>' + T.hole + '</th>' + nine.map(function (h) { return '<th>' + h.number + '</th>'; }).join('') + '</tr></thead><tbody>' +
        row(T.par, function (h) { return '<td>' + h.par + '</td>'; }) +
        row(T.score, function (h) {
          var s = strokes(h); if (!s) return '<td>–</td>';
          return '<td class="' + (s < h.par ? 'u' : s > h.par ? 'o' : '') + '">' + s + '</td>';
        }, 'me') +
        (r.companions || []).map(function (c) {
          return row(esc(c.name), function (h, i) { var v = (c.strokes || [])[start + i]; return '<td>' + (v == null ? '–' : v) + '</td>'; });
        }).join('') +
        (played.some(function (h) { return putts(h) > 0; }) ? row(T.putts, function (h) { return '<td>' + (strokes(h) ? putts(h) : '–') + '</td>'; }) : '') +
        '</tbody></table>';
    }
    out.innerHTML = html + '</div></div>';
  }).catch(function () { out.innerHTML = '<p class="msg">' + T.offline + '</p>'; });
})();
</script>
</body>
</html>
